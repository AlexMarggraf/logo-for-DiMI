<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DiMI Logo Controller</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f3;
      --surface: #ffffff;
      --border: #d8d8d4;
      --text: #1a1a1a;
      --dim: #888;
      --green: #2a7a3b;
      --red: #b83232;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
    }

    html, body { height: 100%; }

    body {
      font-family: var(--sans);
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 24px;
      flex-shrink: 0;
    }

    .site-title {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
    }

    .sep { width: 1px; height: 20px; background: var(--border); }

    .ip-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .label { font-size: 12px; color: var(--dim); }

    input[type="text"] {
      font-family: var(--mono);
      font-size: 13px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      outline: none;
      width: 156px;
      transition: border-color 0.15s;
    }

    input[type="text"].short { width: 60px; }
    input[type="text"]:focus { border-color: var(--text); }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-left: auto;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--dim);
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .dot.ok    { background: var(--green); }
    .dot.err   { background: var(--red); }
    .dot.blink { background: var(--green); animation: blink 1.4s infinite; }
    @keyframes blink { 50% { opacity: 0.25; } }

    /* ── Layout ── */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 268px;
      overflow: hidden;
    }

    /* ── Editor ── */
    .editor-col {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    .editor-wrap {
      flex: 1;
      display: flex;
      overflow: hidden;
      background: var(--surface);
    }

    .line-nums {
      padding: 16px 10px 16px 16px;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.65;
      color: #ccc;
      text-align: right;
      user-select: none;
      background: var(--bg);
      border-right: 1px solid var(--border);
      min-width: 44px;
      white-space: pre;
      overflow: hidden;
    }

    textarea#code {
      flex: 1;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.65;
      border: none;
      outline: none;
      resize: none;
      background: var(--surface);
      color: var(--text);
      padding: 16px 20px;
      tab-size: 2;
      caret-color: var(--text);
    }

    textarea#code::placeholder { color: #ccc; }

    .editor-footer {
      border-top: 1px solid var(--border);
      background: var(--bg);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .meta { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--dim); }

    /* ── Buttons ── */
    button {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 7px 14px;
      transition: background 0.1s;
    }

    button:hover  { background: var(--bg); }
    button:active { background: #e8e8e5; }

    button.primary {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    button.primary:hover    { background: #333; border-color: #333; }
    button.primary:disabled { background: #aaa; border-color: #aaa; cursor: default; }

    button.ghost {
      background: transparent;
      border-color: transparent;
      color: var(--dim);
    }

    button.ghost:hover { color: var(--text); background: transparent; }

    /* ── Right panel ── */
    .right-col {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-head {
      padding: 9px 16px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--dim);
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Log */
    .log-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; border-bottom: 1px solid var(--border); }

    .log-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.7;
      background: var(--surface);
    }

    .log-body::-webkit-scrollbar { width: 3px; }
    .log-body::-webkit-scrollbar-thumb { background: var(--border); }

    .log-line {
      display: flex;
      gap: 10px;
      opacity: 0;
      animation: fi 0.12s forwards;
    }

    @keyframes fi { to { opacity: 1; } }

    .log-time { color: #ccc; flex-shrink: 0; }
    .log-msg  { word-break: break-word; }
    .log-msg.ok  { color: var(--green); }
    .log-msg.err { color: var(--red); }
    .log-msg.dim { color: var(--dim); }

    /* Ref */
    .ref-body { padding: 12px 16px; background: var(--surface); }

    .ref-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 3px 14px;
      font-family: var(--mono);
      font-size: 12px;
    }

    .ref-cmd  { color: var(--text); }
    .ref-desc { color: var(--dim); }
  </style>
</head>
<body>

<header>
  <span class="site-title">dimi logo</span>
  <div class="sep"></div>
  <div class="ip-row">
    <span class="label">IP</span>
    <input type="text" id="ip" value="192.168.1.100" />
    <span class="label">port</span>
    <input type="text" id="port" value="8080" class="short" />
    <button onclick="ping()">Ping</button>
  </div>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="status-text">disconnected</span>
  </div>
</header>

<main>
  <div class="editor-col">
    <div class="editor-wrap">
      <div class="line-nums" id="lnums">1</div>
      <textarea id="code"
        placeholder="logo code..."
        spellcheck="false"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
      ></textarea>
    </div>
    <div class="editor-footer">
      <button class="primary" id="send-btn" onclick="send()">Send to DiMI</button>
      <button onclick="clearCode()">Clear</button>
      <span class="meta" id="meta">0 lines</span>
    </div>
  </div>

  <div class="right-col">
    <div class="log-panel">
      <div class="panel-head">
        <span>Log</span>
        <button class="ghost" onclick="clearLog()" style="font-size:11px;padding:2px 4px;">clear</button>
      </div>
      <div class="log-body" id="log"></div>
    </div>
    <!----
    <div>
      <div class="panel-head">Reference</div>
      <div class="ref-body">
        <div class="ref-grid">
          <span class="ref-cmd">FORWARD n</span><span class="ref-desc">move forward</span>
          <span class="ref-cmd">BACK n</span><span class="ref-desc">move backward</span>
          <span class="ref-cmd">RIGHT deg</span><span class="ref-desc">turn clockwise</span>
          <span class="ref-cmd">LEFT deg</span><span class="ref-desc">turn counter-CW</span>
          <span class="ref-cmd">REPEAT n [</span><span class="ref-desc">loop n times</span>
          <span class="ref-cmd">]</span><span class="ref-desc">end repeat</span>
          <span class="ref-cmd">PENUP</span><span class="ref-desc">lift pen</span>
          <span class="ref-cmd">PENDOWN</span><span class="ref-desc">drop pen</span>
          <span class="ref-cmd">TO name</span><span class="ref-desc">define function</span>
          <span class="ref-cmd">END</span><span class="ref-desc">end function</span>
        </div>
      </div>
    </div>
    --->
  </div>
</main>

<script>
  const codeEl   = document.getElementById('code');
  const lnumsEl  = document.getElementById('lnums');
  const metaEl   = document.getElementById('meta');
  const logEl    = document.getElementById('log');
  const dotEl    = document.getElementById('dot');
  const statusEl = document.getElementById('status-text');
  const sendBtn  = document.getElementById('send-btn');

  function updateEditor() {
    const lines = codeEl.value.split('\n');
    lnumsEl.textContent = lines.map((_, i) => i + 1).join('\n');
    metaEl.textContent = `${lines.length} line${lines.length !== 1 ? 's' : ''}`;
  }

  codeEl.addEventListener('input', updateEditor);
  codeEl.addEventListener('scroll', () => { lnumsEl.scrollTop = codeEl.scrollTop; });
  codeEl.addEventListener('keydown', e => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = codeEl.selectionStart;
      codeEl.value = codeEl.value.slice(0, s) + '  ' + codeEl.value.slice(codeEl.selectionEnd);
      codeEl.selectionStart = codeEl.selectionEnd = s + 2;
      updateEditor();
    }
  });

  function log(msg, type = '') {
    const t = new Date().toTimeString().slice(0, 8);
    const row = document.createElement('div');
    row.className = 'log-line';
    row.innerHTML = `<span class="log-time">${t}</span><span class="log-msg ${type}">${msg}</span>`;
    logEl.appendChild(row);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function clearLog() { logEl.innerHTML = ''; }

  function setStatus(state) {
    dotEl.className = 'dot';
    const map = {
      ok:         ['ok',    'connected'],
      err:        ['err',   'unreachable'],
      connecting: ['blink', 'connecting…'],
    };
    const [cls, txt] = map[state] || ['', 'disconnected'];
    if (cls) dotEl.classList.add(cls);
    statusEl.textContent = txt;
  }

  function baseUrl() {
    const ip   = document.getElementById('ip').value.trim();
    const port = document.getElementById('port').value.trim();
    return `http://${ip}:${port}`;
  }

  function clearCode() { codeEl.value = ''; updateEditor(); }

  async function ping() {
    const url = baseUrl() + '/ping';
    log(`Pinging ${url}…`);
    setStatus('connecting');
    try {
      const res = await fetch(url, { signal: AbortSignal.timeout(3000) });
      if (res.ok) { log('Pong — DiMI is reachable.', 'ok'); setStatus('ok'); }
      else         { log(`HTTP ${res.status}`, 'err');         setStatus('err'); }
    } catch (e) { log(e.message, 'err'); setStatus('err'); }
  }

  async function send() {
    const code = codeEl.value.trim();
    if (!code) { log('Editor is empty.', 'dim'); return; }

    const url = baseUrl() + '/execute';
    log(`Sending to ${url}…`);
    sendBtn.disabled = true;
    sendBtn.textContent = 'Sending…';

    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: code,
        signal: AbortSignal.timeout(10000),
      });
      const body = await res.text();
      if (res.ok) { log(`Accepted — ${body}`, 'ok');  setStatus('ok'); }
      else         { log(`Rejected (${res.status}) — ${body}`, 'err'); setStatus('err'); }
    } catch (e) {
      log(e.message, 'err');
      setStatus('err');
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = 'Send to DiMI';
    }
  }

  updateEditor();
  log('Ready.', 'dim');
</script>
</body>
</html>
